name: Update VPN Servers

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: update-vpngate-servers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =========================================================
      # 2. Install Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # =========================================================
      # 3. Download VPNGate CSV
      # =========================================================
      - name: Download VPNGate data
        run: |
          set -e

          echo "Downloading VPNGate data..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "https://www.vpngate.net/api/iphone/" \
            -o vpngate.csv

          echo "Downloaded file:"
          ls -lh vpngate.csv

          echo "First lines:"
          head -n 5 vpngate.csv

      # =========================================================
      # 4. Generate servers.json
      # =========================================================
      - name: Generate servers.json
        run: |
          cat > generate.py <<'PY'
          import csv
          import base64
          import json
          import re
          from datetime import datetime, timezone

          INPUT = "vpngate.csv"
          OUTPUT = "servers.json"

          servers = []
          seen = set()

          def clean(value):
              if value is None:
                  return ""
              return str(value).strip()

          def to_int(value):
              try:
                  value = clean(value)
                  if value == "":
                      return 0
                  return int(float(value))
              except:
                  return 0

          def to_float(value):
              try:
                  value = clean(value)
                  if value == "":
                      return 0
                  return float(value)
              except:
                  return 0

          def country_code(country):
              country = clean(country)

              if not country:
                  return ""

              mapping = {
                  "United States": "us",
                  "United Kingdom": "gb",
                  "Canada": "ca",
                  "Germany": "de",
                  "France": "fr",
                  "Netherlands": "nl",
                  "Japan": "jp",
                  "Singapore": "sg",
                  "Korea Republic of": "kr",
                  "South Korea": "kr",
                  "Hong Kong": "hk",
                  "Taiwan": "tw",
                  "India": "in",
                  "Indonesia": "id",
                  "Malaysia": "my",
                  "Thailand": "th",
                  "Vietnam": "vn",
                  "Bangladesh": "bd",
                  "Pakistan": "pk",
                  "Australia": "au",
                  "Brazil": "br",
                  "Turkey": "tr",
                  "Sweden": "se",
                  "Switzerland": "ch",
                  "Poland": "pl",
                  "Romania": "ro",
                  "Russia": "ru",
                  "Ukraine": "ua",
                  "Spain": "es",
                  "Italy": "it",
                  "Finland": "fi",
                  "Norway": "no",
                  "Denmark": "dk",
                  "Austria": "at",
                  "Belgium": "be",
                  "Czech Republic": "cz",
                  "Portugal": "pt",
                  "Ireland": "ie",
                  "New Zealand": "nz",
                  "Mexico": "mx",
                  "Argentina": "ar",
                  "Chile": "cl",
                  "South Africa": "za"
              }

              if country in mapping:
                  return mapping[country]

              return ""

          # ---------------------------------------------------------
          # Read VPNGate CSV
          # ---------------------------------------------------------
          with open(INPUT, "r", encoding="utf-8", errors="ignore") as f:

              lines = f.readlines()

          # VPNGate API contains comments before CSV header.
          csv_lines = []

          for line in lines:
              if line.startswith("#"):
                  continue

              if line.strip():
                  csv_lines.append(line)

          if not csv_lines:
              raise RuntimeError("VPNGate CSV is empty")

          reader = csv.DictReader(csv_lines)

          for row in reader:

              try:

                  ip = clean(
                      row.get("IP") or
                      row.get("IP Address") or
                      row.get("ip")
                  )

                  host = clean(
                      row.get("HostName") or
                      row.get("HostName") or
                      row.get("host")
                  )

                  country = clean(
                      row.get("CountryLong") or
                      row.get("Country") or
                      row.get("country")
                  )

                  if not ip:
                      continue

                  # -------------------------------------------------
                  # Get TCP port
                  # -------------------------------------------------
                  tcp_port = to_int(
                      row.get("TCPPort") or
                      row.get("TCP Port") or
                      row.get("tcp_port")
                  )

                  if tcp_port <= 0:
                      tcp_port = 443

                  # -------------------------------------------------
                  # Get UDP port
                  # -------------------------------------------------
                  udp_port = to_int(
                      row.get("UDPPort") or
                      row.get("UDP Port") or
                      row.get("udp_port")
                  )

                  # -------------------------------------------------
                  # OVPN Base64
                  # -------------------------------------------------
                  ovpn_base64 = clean(
                      row.get("OpenVPN_ConfigData_Base64") or
                      row.get("OpenVPN_ConfigData") or
                      row.get("ovpn_base64")
                  )

                  if not ovpn_base64:
                      continue

                  # -------------------------------------------------
                  # Decode OVPN to validate it
                  # -------------------------------------------------
                  try:

                      decoded = base64.b64decode(
                          ovpn_base64
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  except Exception:
                      continue

                  if not decoded:
                      continue

                  # -------------------------------------------------
                  # Find remote host/port
                  # -------------------------------------------------
                  remote_match = re.search(
                      r"(?m)^\s*remote\s+([^\s]+)\s+(\d+)",
                      decoded
                  )

                  remote_host = ip
                  remote_port = tcp_port

                  if remote_match:

                      remote_host = remote_match.group(1)

                      try:
                          remote_port = int(
                              remote_match.group(2)
                          )
                      except:
                          remote_port = tcp_port

                  # -------------------------------------------------
                  # Only TCP OpenVPN
                  # -------------------------------------------------
                  proto_match = re.search(
                      r"(?m)^\s*proto\s+([^\s]+)",
                      decoded,
                      re.IGNORECASE
                  )

                  proto = ""

                  if proto_match:
                      proto = proto_match.group(1).lower()

                  if proto.startswith("udp"):
                      continue

                  # -------------------------------------------------
                  # Unique server
                  # -------------------------------------------------
                  unique_key = "{}:{}".format(
                      remote_host,
                      remote_port
                  )

                  if unique_key in seen:
                      continue

                  seen.add(unique_key)

                  # -------------------------------------------------
                  # Server values
                  # -------------------------------------------------
                  score = to_int(
                      row.get("Score") or
                      row.get("score")
                  )

                  ping = to_int(
                      row.get("Ping") or
                      row.get("ping")
                  )

                  speed = to_int(
                      row.get("Speed") or
                      row.get("speed")
                  )

                  sessions = to_int(
                      row.get("NumVpnSessions") or
                      row.get("sessions")
                  )

                  uptime = to_int(
                      row.get("Uptime") or
                      row.get("uptime")
                  )

                  total_users = to_int(
                      row.get("TotalUsers") or
                      row.get("total_users")
                  )

                  total_traffic = to_int(
                      row.get("TotalTraffic") or
                      row.get("total_traffic")
                  )

                  log_type = clean(
                      row.get("LogType") or
                      row.get("log_type")
                  )

                  operator = clean(
                      row.get("Operator") or
                      row.get("operator")
                  )

                  message = clean(
                      row.get("Message") or
                      row.get("message")
                  )

                  cc = country_code(country)

                  # -------------------------------------------------
                  # Create server object
                  # -------------------------------------------------
                  server = {
                      "host": host if host else remote_host,
                      "ip": ip,
                      "remote": remote_host,
                      "port": remote_port,

                      "tcp_port": remote_port,
                      "udp_port": udp_port,

                      "proto": "tcp",

                      "score": score,
                      "ping": ping,
                      "speed": speed,

                      "country": country,
                      "country_code": cc,

                      "sessions": sessions,
                      "uptime": uptime,

                      "total_users": total_users,
                      "total_traffic": total_traffic,

                      "log_type": log_type,
                      "operator": operator,
                      "message": message,

                      "ovpn_base64": ovpn_base64
                  }

                  servers.append(server)

              except Exception as e:

                  print(
                      "Skipping server:",
                      str(e)
                  )

          # ---------------------------------------------------------
          # Sort
          # ---------------------------------------------------------
          servers.sort(
              key=lambda x: (
                  x.get("ping", 999999)
                  if x.get("ping", 0) > 0
                  else 999999
              )
          )

          # ---------------------------------------------------------
          # Output
          # ---------------------------------------------------------
          result = {
              "success": True,
              "source": "VPNGate",
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "count": len(servers),

              "servers": servers
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Generated {} servers".format(
                  len(servers)
              )
          )

          print(
              "Output size:",
              len(
                  json.dumps(
                      result,
                      ensure_ascii=False
                  )
              ),
              "bytes"
          )

          if len(servers) == 0:
              raise RuntimeError(
                  "No valid TCP VPN servers found"
              )
          PY

          python generate.py

          echo ""
          echo "servers.json:"
          ls -lh servers.json

          echo ""
          echo "Server count:"
          python -c "import json; d=json.load(open('servers.json')); print(d['count'])"

      # =========================================================
      # 5. Validate JSON
      # =========================================================
      - name: Validate servers.json
        run: |
          python - <<'PY'
          import json

          with open(
              "servers.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not data.get("success"):
              raise SystemExit(
                  "servers.json success=false"
              )

          servers = data.get("servers", [])

          if not servers:
              raise SystemExit(
                  "servers.json contains 0 servers"
              )

          print(
              "Valid JSON"
          )

          print(
              "Server count:",
              len(servers)
          )

          print(
              "First server:",
              servers[0]
          )
          PY

      # =========================================================
      # 6. Commit and push
      # =========================================================
      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add servers.json

          if git diff --cached --quiet; then
            echo "No changes to servers.json"
            exit 0
          fi

          git commit -m "Update VPN servers"

          echo "Fetching latest main..."

          git fetch origin main

          echo "Rebasing..."

          git rebase origin/main

          echo "Pushing..."

          git push origin HEAD:main

          echo "VPN server database updated successfully."
